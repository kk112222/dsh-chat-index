<svg xmlns="http://www.w3.org/2000/svg" width="860" height="660" viewBox="0 0 860 660" role="img" aria-label="dsh-chat-index: expanded chain panel with branch subtree">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1c20"/>
      <stop offset="1" stop-color="#141519"/>
    </linearGradient>
  </defs>
  <rect width="860" height="660" fill="url(#bg2)"/>

  <!-- conversation column (behind, dimmed) -->
  <rect x="20" y="24" width="404" height="612" rx="14" fill="#1e1f24" stroke="#292b31"/>
  <text x="42" y="56" fill="#8f939e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Session · 会话内容</text>
  <g fill="#2a2c33">
    <rect x="42" y="80" width="280" height="44" rx="10"/>
    <rect x="120" y="138" width="280" height="70" rx="10" fill="#24262c"/>
    <rect x="42" y="222" width="250" height="40" rx="10"/>
    <rect x="120" y="276" width="280" height="62" rx="10" fill="#24262c"/>
    <rect x="42" y="352" width="230" height="40" rx="10"/>
  </g>

  <!-- rail -->
  <rect x="436" y="60" width="34" height="540" rx="10" fill="#26282e" stroke="#3a3d45"/>
  <rect x="442" y="68" width="22" height="16" rx="8" fill="#31343b"/>
  <text x="453" y="80" fill="#c9ccd4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">12</text>
  <line x1="453" y1="96" x2="453" y2="566" stroke="#3f434c"/>
  <g fill="#7d838f">
    <circle cx="453" cy="118" r="4.5"/><circle cx="453" cy="164" r="4.5"/>
    <circle cx="453" cy="214" r="4.5"/><circle cx="453" cy="286" r="4.5"/>
    <circle cx="453" cy="352" r="4.5"/><circle cx="453" cy="430" r="4.5"/>
  </g>
  <circle cx="453" cy="516" r="6.5" fill="#4a7bd6"/>

  <!-- chain panel -->
  <rect x="480" y="60" width="360" height="540" rx="12" fill="#232529" stroke="#3a3d45"/>
  <rect x="480" y="60" width="360" height="46" rx="12" fill="#26282e"/>
  <rect x="480" y="94" width="360" height="12" fill="#26282e"/>
  <text x="500" y="89" fill="#e8e9ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">提问索引 · 12</text>
  <text x="812" y="89" fill="#a9aeb9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">✕</text>
  <line x1="480" y1="106" x2="840" y2="106" stroke="#33363d"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- node 1 -->
    <circle cx="503" cy="132" r="3.5" fill="#4a7bd6" opacity="0.85"/>
    <text x="518" y="136" fill="#e8e9ee" font-size="12.5">帮我做一个会话提问索引插件</text>
    <text x="518" y="152" fill="#8f939e" font-size="11">2026-09-12 22:41</text>

    <!-- node 2 -->
    <circle cx="503" cy="182" r="3.5" fill="#4a7bd6" opacity="0.85"/>
    <text x="518" y="186" fill="#e8e9ee" font-size="12.5">右侧窄条放在会话右边,点一下能跳转</text>
    <text x="518" y="202" fill="#8f939e" font-size="11">2026-09-12 23:05</text>

    <!-- node 3 -->
    <circle cx="503" cy="232" r="3.5" fill="#4a7bd6" opacity="0.85"/>
    <text x="518" y="236" fill="#e8e9ee" font-size="12.5">点击侧边栏要能放大成链状结构</text>
    <text x="518" y="252" fill="#8f939e" font-size="11">2026-09-12 23:26</text>

    <!-- branch row -->
    <rect x="496" y="272" width="42" height="18" rx="9" fill="#4a7bd6" fill-opacity="0.18"/>
    <text x="517" y="285" fill="#6f9bea" font-size="10" text-anchor="middle">分支</text>
    <text x="546" y="286" fill="#dfe1e7" font-size="12.5">调研:slot 座位与注册规范</text>
    <text x="546" y="302" fill="#8f939e" font-size="11">3 个提问 · 2026-09-12 23:40</text>
    <!-- branch children -->
    <line x1="524" y1="312" x2="524" y2="392" stroke="#3a3d45"/>
    <circle cx="528" cy="330" r="3" fill="#4a7bd6" opacity="0.7"/>
    <text x="542" y="334" fill="#cfd2d9" font-size="12">这个 seat 是 list 还是 single?</text>
    <text x="542" y="349" fill="#8f939e" font-size="11">2026-09-12 23:44</text>
    <circle cx="528" cy="374" r="3" fill="#4a7bd6" opacity="0.7"/>
    <text x="542" y="378" fill="#cfd2d9" font-size="12">重复挂载会怎样?</text>
    <text x="542" y="393" fill="#8f939e" font-size="11">2026-09-12 23:47</text>

    <!-- node 4 -->
    <circle cx="503" cy="422" r="3.5" fill="#4a7bd6" opacity="0.85"/>
    <text x="518" y="426" fill="#e8e9ee" font-size="12.5">最新一条提问也要有圆点</text>
    <text x="518" y="442" fill="#8f939e" font-size="11">2026-09-13 14:20</text>

    <!-- node 5 (current) -->
    <circle cx="503" cy="472" r="4" fill="#4a7bd6"/>
    <circle cx="503" cy="472" r="8" fill="none" stroke="#4a7bd6" stroke-opacity="0.35"/>
    <text x="518" y="476" fill="#ffffff" font-size="12.5">圆点太密不好点,间距拉开一点</text>
    <text x="518" y="492" fill="#8f939e" font-size="11">2026-09-13 14:32 · 当前</text>
  </g>

  <!-- caption -->
  <text x="20" y="652" fill="#8b909c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">链面板:节点显示问题摘要与时间,分支/子会话以子树挂在主线程之下,点节点跳转并高亮</text>
</svg>
